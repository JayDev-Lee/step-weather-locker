name: Signed APK release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (for example v1.2.1)'
        required: true
        default: v1.2.0
        type: string
      publish:
        description: 'Attach the APK to the existing version tag (checks out that tag)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version || github.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Resolve version from tag
        env:
          VERSION_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python3 scripts/release-version.py "$VERSION_TAG" >> "$GITHUB_ENV"
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK components
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Restore licensed Samsung SDK
        env:
          SAMSUNG_SDK_PASSPHRASE: ${{ secrets.SAMSUNG_SDK_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SAMSUNG_SDK_PASSPHRASE" || { echo 'Missing SAMSUNG_SDK_PASSPHRASE'; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in .github/secure/samsung-health-data-api-1.1.0.aar.enc \
            -out app/libs/samsung-health-data-api-1.1.0.aar \
            -pass env:SAMSUNG_SDK_PASSPHRASE
          echo 'f5d3d83cf00b97d0bb1b1db4da076e861eb1c3e6e704d89a34e68909d2f38654  app/libs/samsung-health-data-api-1.1.0.aar' | sha256sum --check
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64: run scripts/configure-release-secrets.py locally.')
          path = Path(os.environ['RUNNER_TEMP']) / 'haruring-release.jks'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
      - name: Build signed release and run checks
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --no-daemon --console=plain --no-scan
      - name: Verify signature and prepare APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/haruring-${RELEASE_VERSION_NAME}.apk"
          cd dist
          sha256sum "haruring-${RELEASE_VERSION_NAME}.apk" > "haruring-${RELEASE_VERSION_NAME}.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haruring-${{ env.RELEASE_VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove private build inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/haruring-release.jks" app/libs/samsung-health-data-api-1.1.0.aar

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --dir dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Attach missing assets; gh refuses to overwrite published files.
            gh release upload "$TAG" dist/*/*.apk dist/*/*.sha256
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "하루링 $TAG" dist/*/*.apk dist/*/*.sha256
          fi
